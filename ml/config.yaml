project:
  # A label for humans. `version` was removed by SPEC 0047: it was required by
  # `load_config`, read by nothing, and collided in meaning with
  # `data.dataset_version` and the CLIs' `--version`.
  name: "visiosoil-soil-classifier"

# The classes the model emits, in output order. Four, not five: ADR 0016 keeps
# Siltosa out of the first model, and SPEC 0042's k = 5 needs at least five
# splittable sample groups per class where Siltosa has three.
#
# This is not the archive's vocabulary. The v1 manifest still holds every
# Siltosa row SPEC 0040 ingested; `src.manifest.ARCHIVE_CLASSES` is what a
# manifest may contain, and this is what the model emits. Dropping a class here
# excludes its groups from the fold pool and leaves the archive's record intact.
#
# Output index 2 means Muito Argilosa from SPEC 0046 onward, and meant Siltosa
# before it. Nothing produced under the five-class list is comparable to
# anything produced after.
classes:
  - "Arenosa"
  - "Media"
  - "Muito Argilosa"
  - "Argilosa"

data:
  raw_dir: "data/raw"
  splits_dir: "data/splits"
  # A dataset version is an immutable directory: adding images creates the next
  # one and never mutates this one, so every experiment can name the data it ran
  # on. See docs/specs/0033-dataset-protocol-manifest-and-splits.md.
  datasets_dir: "data/datasets"
  dataset_version: "v1"
  # 160, not 224: the patch side in millimetres is `image_size x
  # canonical_mm_per_px`, so at 0.1292 this is a 20.7 mm patch and a 90 mm dish
  # yields 25 of them (ADR 0018). MobileNetV2 publishes ImageNet weights at 96,
  # 128, 160, 192 and 224, and `load_config` refuses any other value.
  image_size: 160
  seed: 42

# The evaluation protocol: repeated stratified group k-fold with nested
# selection (ADR 0020, SPEC 0042). There is no train/val/test partition; every
# splittable sample group is tested exactly once per repeat, and the choice made
# for an outer fold is made on inner folds of that fold's own training side.
evaluation:
  # Five outer folds leave roughly 15 test groups each and keep Argilosa, the
  # binding class at 16 splittable groups, at three or four per fold. Ten would
  # halve that and double the cost for the same 77-group pool.
  k: 5
  # Five repeats, each redrawing the folds from its own derived seed, so the
  # spread across repeats measures training and fold-assignment variance. It is
  # not a confidence interval: the Wilson interval on the pooled group count
  # carries sampling variance, and the spread across folds is never reported as
  # uncertainty at all.
  repeats: 5
  # Inner folds of each outer fold's training side. Selection runs here or it
  # leaks, and at this sample size the leak dominates (Vabalas et al. 2019).
  inner_k: 4
  alpha: 0.05
  power: 0.80
  # Contrasts are pre-registered before a run, so a result cannot be read for
  # whichever comparison happens to clear. Each entry names two arms and its
  # family: `primary` for an arm against the shuffled-label control, and at most
  # one `secondary`. An unregistered contrast is refused by name.
  #
  # Empty until the experiment that owns the arms registers its own: E0's arms
  # and its decision rule belong to SPEC 0044, not to this protocol.
  contrasts: []

preprocessing:
  normalization: "mobilenet_v2"
  bake_into_model: true
  # The scale every photograph is resampled to before a patch is cut, in
  # millimetres per pixel. Measured, not chosen: it is the 95th percentile of
  # the dish-rim readings over all 221 photographs of v1, and
  # `ml/tests/test_patches.py` refuses this value to drift from
  # `ml/measurements/dish-scale-v1.json`. See SPEC 0052 and ADR 0017.
  #
  # A photograph coarser than this is refused rather than upsampled: reaching
  # the canonical from below would invent grain that was never photographed.
  canonical_mm_per_px: 0.1292
  # The grid strides by half a patch, so patches overlap by 50 %. A
  # non-overlapping grid holds nine patches on a 90 mm dish and steps between
  # perfect squares as the disc grows; this one gives 25 and varies smoothly.
  patch_stride_fraction: 0.5
  # Below this the region is refused. The floor is on the dispersion measure,
  # not the classification: a mean over four patches is usable, an entropy over
  # four is too coarse to warn with (ADR 0018).
  min_patches: 9

augmentation:
  horizontal_flip: true
  vertical_flip: false
  # Degrees, converted to a fraction of a full turn by `preprocess.py`.
  rotation_degrees: 15
  brightness_range: [0.85, 1.15]
  contrast_range: [0.9, 1.1]
  zoom_range: [0.95, 1.05]
  # A fraction of the image side, in each direction.
  translation_fraction: 0.05

model:
  architecture: "mobilenetv2"
  freeze_backbone: true
  dropout: 0.5
  unfreeze_at_epoch: 10
  unfreeze_layers: 50

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  fine_tune_learning_rate: 0.0001
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  class_weights: "balanced"
  # Forces deterministic TensorFlow kernels so a run is reproducible on GPU as
  # well as CPU. Seeding alone is not enough on GPU, and E0 measures an effect
  # against run-to-run variance. Set to false only for an exploratory run that
  # needs the throughput; the effective value is recorded in metrics.json.
  deterministic_ops: true

export:
  quantization: "none"
  output_dir: "models"
