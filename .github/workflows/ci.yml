name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - name: Generate Drift adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The durable-numbering guard reads git history to detect a deleted
          # spec or ADR. A shallow clone would show none and pass vacuously.
          fetch-depth: 0
          # The harness-wiring guard reads the standards the .standards
          # submodule supplies. Without this it finds an empty directory, which
          # is the same vacuous pass the line above exists to prevent.
          submodules: recursive
          # The steps below run repository-controlled code (build_runner, tests)
          # and need no GitHub credentials, so do not leave a token in .git.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - name: Install SQLite (for Drift in-memory tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - run: flutter pub get
      - name: Generate Drift adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

  ml-tests:
    runs-on: ubuntu-latest
    # Least privilege for the job that runs third-party Python code: this one
    # installs and executes the whole ML dependency tree, so a compromised
    # package must not inherit a token that can write to the repository.
    # `persist-credentials: false` below stops the token being written to disk;
    # it does not reduce the token's scopes, which is what this does.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Runs repository-controlled code and needs no GitHub credentials.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ML tests
        working-directory: ml
        run: python -m pytest tests/ -v

  corpus-tests:
    runs-on: ubuntu-latest
    # Same least-privilege reasoning as ml-tests, for the same reason: this job
    # runs the corpus build's own code and its test dependency.
    permissions:
      contents: read
    steps:
      # Pinned to commit SHAs rather than tags. A tag is mutable: whoever can
      # move `v4` can run code in this job, and the restricted token above limits
      # what that code may do without authenticating what the code is. The
      # comment names the tag each SHA was at, so a reader can check it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: corpus/requirements.txt
      - name: Install corpus dependencies
        working-directory: corpus
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run corpus tests
        working-directory: corpus
        # No model and no network: the chain is driven by a scripted client and
        # the fetcher by an injected transport, so this job is deterministic.
        run: python -m pytest tests/ -v

  gates:
    # The standards gates (#201, SPEC 0085). The hooks run `mf check` only on a
    # clone that wired `core.hooksPath` and has the binary, so a pull request
    # from anywhere else met no gate, and nothing said so.
    # `.standards/docs/standards/INDEX.md` puts the same `mf check` in CI for
    # that reason. Modelled on the framework's own `.github/workflows/gate.yml`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The spec, commit and branch gates read the range between the base
          # branch and this one, and a shallow clone has neither end of it.
          fetch-depth: 0
          # The gates read what the .standards submodule supplies: the commit
          # vocabulary, the documentation rules, the instruction-file source.
          submodules: recursive
          persist-credentials: false
      - name: Install mf at the locked version
        # The released binary `.framework.lock` pins, not a build from source:
        # an adopter runs the version it adopted, and the checksum is what makes
        # the download that binary.
        run: |
          set -euo pipefail
          version="$(sed -n 's/^framework_version = "\(.*\)"$/\1/p' .framework.lock)"
          if [ -z "$version" ]; then
            echo "::error::.framework.lock records no framework_version"
            exit 1
          fi
          asset="mf_${version}_linux_amd64"
          base="https://github.com/LukeSantossz/my-framework/releases/download/${version}"
          dir="$RUNNER_TEMP/mf"
          mkdir -p "$dir/bin"
          curl -fsSL --retry 3 -o "$dir/$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$dir/SHA256SUMS" "$base/SHA256SUMS"
          # Only the asset's own line, so a missing entry fails rather than
          # checking nothing.
          (cd "$dir" && awk -v a="$asset" '$2 == a' SHA256SUMS | sha256sum -c -)
          install -m 0755 "$dir/$asset" "$dir/bin/mf"
          echo "$dir/bin" >> "$GITHUB_PATH"
          export PATH="$dir/bin:$PATH"
          reported="$(mf version)"
          if [ "$reported" != "mf $version" ]; then
            echo "::error::.framework.lock pins $version, but the binary reports: $reported"
            exit 1
          fi
          echo "Gates ran with $reported, the version .framework.lock pins." >> "$GITHUB_STEP_SUMMARY"
      - name: Gates (pull request)
        if: github.event_name == 'pull_request'
        env:
          # Read through the environment rather than interpolated into the
          # script: a branch name may contain a backtick or a dollar sign, and an
          # expression pasted into a `run:` block is shell source.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # actions/checkout leaves a pull request on a detached HEAD at the
          # merge commit. The spec, commit and branch gates ask git which branch
          # this is and what it adds over its base, and there the answers are
          # "HEAD" and a base that exists only as a remote-tracking ref. Restoring
          # both refs makes the job report on the change, not on the checkout.
          git switch --force-create "$HEAD_REF" "$HEAD_SHA"
          # A fork may propose its own `main`, and git refuses to force-update
          # the branch it has checked out. With no second ref to restore, the
          # three range gates report "on the base branch".
          if [ "$HEAD_REF" != "$BASE_REF" ]; then
            git branch --force "$BASE_REF" "origin/$BASE_REF"
          fi
          mf check
      - name: Gates (no pull request)
        if: github.event_name != 'pull_request'
        # A push to main or dev, or a manual run, has no branch under review:
        # the spec, commit and branch gates ran on the pull request. What is
        # left to ask is whether the tree is in the state its standards
        # describe, which is the four gates that read it.
        run: mf check docs records agents design

  build:
    needs: [analyze, test, ml-tests, corpus-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - name: Generate Drift adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - name: Verify R8 kept the auth classes in the release APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          tmp=$(mktemp -d)
          unzip -o -q "$apk" 'classes*.dex' -d "$tmp"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          dexdump="$(find "$sdk/build-tools" -name dexdump -type f | sort -V | tail -1)"
          # dexdump prints "Class descriptor  : 'L...;'" only for classes DEFINED
          # in the DEX, so this asserts the auth classes survived R8 rather than
          # merely being referenced somewhere in the string pool.
          defs="$(for d in "$tmp"/classes*.dex; do "$dexdump" "$d"; done | grep 'Class descriptor' || true)"
          # Use a here-string, not a pipe: `grep -q` exits on the first match and
          # would SIGPIPE the writer, which under `pipefail` flips a found class
          # into a false "stripped" failure on a large DEX.
          if ! grep -q "Lcom/google/crypto/tink/" <<< "$defs"; then
            echo "::error::R8 stripped the Tink class definitions from the release APK"
            exit 1
          fi
          if ! grep -q "Lcom/google/android/gms/auth/" <<< "$defs"; then
            echo "::error::R8 stripped the Google Play Services auth class definitions from the release APK"
            exit 1
          fi
          echo "Auth classes defined in the release DEX."
      - name: Refuse the debug key for an unflagged bundle
        # Without key.properties a store bundle must fail and name the file
        # (SPEC 0111). This runs Gradle's own check, which stops before any task.
        shell: bash
        run: |
          if flutter build appbundle --release > bundle-refusal.log 2>&1; then
            cat bundle-refusal.log
            echo "::error::the release app bundle was signed with the debug key"
            exit 1
          fi
          cat bundle-refusal.log
          grep -q "android/key.properties not found; refusing to sign the release app bundle" bundle-refusal.log
      - name: Build the release app bundle
        # Play takes a bundle, not an APK, so it is built on every change rather
        # than first on release day (SPEC 0102). With no key.properties here it
        # is debug-signed, as the APK is, so this step names the opt-out that
        # lets a bundle prove it builds (SPEC 0111).
        env:
          VISIOSOIL_ALLOW_DEBUG_BUNDLE: "true"
        run: flutter build appbundle --release
      - name: Print the bundle signer
        # Printed, not asserted: CI gets the upload key with #272, and this line
        # is what shows which key signed the run's bundle.
        run: keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  smoke:
    # Boot the minified release APK on an emulator so R8 regressions that only
    # surface at runtime (issue #69, problem 2) fail the pipeline. The DEX check
    # in `build` guards that the auth classes survived R8; this proves the release
    # build actually starts.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Targeting 35 enforces edge-to-edge and targeting 36 makes predictive back
      # the default, so the boot runs on each, and on 34 as the floor it has
      # proven since #69 (SPEC 0103). Each version reports on its own: a crash
      # on 36 must not cancel 35 before it says whether it boots.
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk
      - name: Boot smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # android-emulator-runner runs each line as a separate `sh -c`, so a
          # variable cannot span lines and every construct stays on one line. The
          # last line captures the PID, checks the process is alive (a crash that
          # kills it), and scopes the crash scan to that PID (so an unrelated system
          # process cannot false-fail the job) — all in one shell. It catches
          # native/Java crashes AND Dart-side failures (Flutter logs an uncaught
          # error under E/flutter as "Unhandled Exception" or "EXCEPTION CAUGHT BY").
          script: |
            adb install -r apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.visiosoil.app -c android.intent.category.LAUNCHER 1
            sleep 25
            if pid=$(adb shell pidof com.visiosoil.app | tr -d '[:space:]'); [ -n "$pid" ]; then adb logcat -d --pid="$pid" | grep -E "FATAL EXCEPTION|E AndroidRuntime|Unhandled Exception|EXCEPTION CAUGHT BY" && { echo "::error::App logged a fatal error on startup"; exit 1; }; echo "Boot smoke passed."; else echo "::error::App process not running after launch (crashed on startup)"; exit 1; fi

  build-ios:
    # Compile the real iOS target so an iOS-only platform-config break (e.g. the
    # missing reversed-client-id URL scheme fixed in #66) fails the pipeline
    # instead of merging green. macos-latest is the only runner that can run
    # xcodebuild; --no-codesign exercises the Xcode/Info.plist build without
    # needing signing certificates or provisioning profiles.
    needs: [analyze, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - name: Generate Drift adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign
